server:
  port: ${PORT:8082}

spring:
  application:
    name: business-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always